[project]
name = "my-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jin", email = "122090871@link.cuhk.edu.cn" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.1",
    "langchain-deepseek>=1.2.0",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "lark>=1.3.1",
    "mteb>=2.27.14",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.3.0",
    "torch==2.11.0+cu128",
]

[project.scripts]
my-rag = "my_rag.cli:main"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
